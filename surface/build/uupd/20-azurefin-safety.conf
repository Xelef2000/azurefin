[Unit]
ConditionACPower=true
ConditionKernelCommandLine=!rd.live.image
ConditionKernelCommandLine=!azurefin.live=1

[Service]
# Preparation only: the timer and OS module stay disabled until hardware tests.
ExecStart=
ExecStart=/usr/bin/flock --nonblock /var/lib/azurefin/firmware-store.lock /usr/bin/bash -ec 'python3 /usr/libexec/azurefin/system_update_preflight.py && exec /usr/bin/uupd --hw-check --log-level=debug --json'
