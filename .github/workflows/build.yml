name: Validate release sources
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test release auditor
        run: python3 scripts/test_audit_release.py
      - name: Test installer transformations
        working-directory: surface
        run: python3 -m unittest test_patch_installer_grub.py test_installed_boot.py test_installer_fix_fstab.py
# Publication is exclusively release-romulus.yml. Never run the legacy
# firmware-inclusive Containerfile automatically on a push or pull request.
