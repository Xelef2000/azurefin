name: Validate release sources
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_ota_test:
        description: Publish tiny non-bootable fixtures and test real signatures
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  signed-ota-test:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_ota_test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07
        with:
          cosign-release: v3.1.4
      - name: Install container tools
        run: sudo apt-get update && sudo apt-get install -y podman skopeo
      - name: Test real signatures and rejection cases
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/test-ota-signatures.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ota-signature-test-${{ github.run_id }}
          path: ota-signature-results/
          if-no-files-found: error
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test release auditor
        run: python3 scripts/test_audit_release.py
      - name: Test native signing orchestration
        run: python3 scripts/test_native_signing.py
      - name: Test testing-channel promotion
        run: |
          python3 scripts/test_promote_testing.py
          shellcheck scripts/promote-testing.sh
      - name: Test installer transformations
        working-directory: surface
        run: python3 -m unittest test_patch_installer_grub.py test_installed_boot.py test_installer_fix_fstab.py test_release_workspace.py test_release_iso_grub.py test_iso_tools.py test_reset_installer_machine_id.py test_live_user.py test_live_media_local.py test_verify_installer_support.py test_update.py
      - name: Check release ISO shell scripts
        run: shellcheck surface/40-prepare-romulus-iso.sh surface/50-compose-release-iso.sh surface/51-audit-release-iso.sh surface/52-check-iso-tools.sh surface/live-session/*.sh surface/build/16-ota-tools.sh scripts/test-ota-signatures.sh scripts/test-native-registry-signatures.sh scripts/sign-native-ota.sh
      - name: Test firmware store and generic loader
        working-directory: surface
        run: python3 -m unittest test_firmware_bundle.py test_firmware_store_probe.py test_firmware_loader.py test_firmware_store_build.py test_firmware_preflight.py
      - name: Check firmware-store shell scripts
        run: shellcheck surface/build/20-firmware-store.sh surface/dracut/91azurefin-firmware/*.sh
# Publication is gated by release-romulus.yml and release-iso.yml. Never run the legacy
# firmware-inclusive Containerfile automatically on a push or pull request.
