name: Release audited Romulus base and installer
on:
  release:
    types: [published]
  # A tag-only candidate permits OTA testing before publishing a GitHub release.
  # Dispatch using a reviewed version tag, never a branch.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: romulus-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  image:
    # A prebuilt release publishes an already audited, hardware-tested ISO.
    # Do not silently replace its inputs with freshly resolved package builds.
    if: "(github.event_name == 'release' && !contains(github.event.release.body, '<!-- azurefin:prebuilt-tested-iso -->')) || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      REGISTRY_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - name: Prepare builder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          printf 'Release: %s\nRevision: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$RELEASE_TAG" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > release-metadata/build-inputs.txt
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha)?$ ]] || {
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-alpha" >&2; exit 1;
          }
          [[ "$(uname -m)" == aarch64 ]]
          command -v podman >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y podman
          }
          printf 'IMAGE=ghcr.io/%s/azurefin:%s-base\n' "${REGISTRY_OWNER,,}" "$RELEASE_TAG" >> "$GITHUB_ENV"
          printf 'INSTALLER=ghcr.io/%s/azurefin:%s-installer\n' "${REGISTRY_OWNER,,}" "$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07
        with:
          cosign-release: v3.1.4
      - name: Build firmware-free ARM64 base
        shell: bash
        run: |
          set -euo pipefail
          podman build --platform linux/arm64 --target base-image \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.azurefin.firmware=post-install-provisioning" \
            -f Containerfile.romulus -t "$IMAGE" .
          podman run --rm --entrypoint rpm "$IMAGE" -qa | sort > release-metadata/packages.txt
      - name: Audit every base layer before building the installer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_audit_release.py
          podman save --format oci-dir -o base-audit "$IMAGE"
          python3 scripts/audit-release.py oci base-audit surface/firmware-policy.json | tee release-metadata/base-audit.txt
      - name: Build Microsoft-firmware-free installer
        shell: bash
        run: |
          set -euo pipefail
          BASE_ID=$(podman image inspect --format '{{.Id}}' "$IMAGE")
          podman build --platform linux/arm64 --network=host --pull=never \
            --build-arg "BASE_IMAGE=$BASE_ID" --build-arg INSTALLER_FIRMWARE=none \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            -f Containerfile.installer -t "$INSTALLER" .
          podman save --format oci-dir -o installer-audit "$INSTALLER"
          python3 scripts/audit-release.py oci installer-audit surface/firmware-policy.json | tee release-metadata/installer-audit.txt
      - name: Publish only audited versioned images to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io -u "$REGISTRY_OWNER" --password-stdin
          export DOCKER_CONFIG="$RUNNER_TEMP/azurefin-cosign-auth"
          mkdir -m 0700 -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "$REGISTRY_OWNER" --password-stdin
          unset GHCR_TOKEN
          trap 'podman logout ghcr.io' EXIT
          podman push --digestfile release-metadata/digest.txt "$IMAGE"
          podman push --digestfile release-metadata/installer-digest.txt "$INSTALLER"
          # Sign immutable digests, not mutable tags. Bind the requested release
          # and component into the signed payload as well as the certificate.
          for component in base installer; do
            digestfile=release-metadata/digest.txt
            [[ "$component" == base ]] || digestfile=release-metadata/installer-digest.txt
            reference="${IMAGE%:*}@$(cat "$digestfile")"
            cosign sign --yes -a "release=$RELEASE_TAG" -a "component=$component" "$reference"
            cosign verify \
              --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release-romulus.yml@refs/tags/$RELEASE_TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              -a "release=$RELEASE_TAG" -a "component=$component" "$reference" \
              > "release-metadata/$component-signature.json"
          done
          {
            printf 'Image: %s\n\n' "$IMAGE"
            printf 'Digest: %s\n\n' "$(cat release-metadata/digest.txt)"
            printf 'Firmware-free bootstrap system: run azurefin-setup-firmware after installation.\n'
            printf '\nInstaller build input: %s\nFedora redistributable firmware is included; Microsoft-extracted firmware is excluded.\n' "$INSTALLER"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Add native OTA signature to audited base only
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZUREFIN_OTA_SIGNING_KEY: ${{ secrets.AZUREFIN_OTA_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.AZUREFIN_OTA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/sign-native-ota.sh "${IMAGE%:*}@$(cat release-metadata/digest.txt)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-metadata-${{ github.event.release.tag_name || github.ref_name }}
          path: release-metadata/
          if-no-files-found: error
          retention-days: 90
