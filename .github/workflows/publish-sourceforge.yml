name: Publish complete ISO to SourceForge
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release with audited ISO parts
        required: true
        type: string
      finalize_only:
        description: Finalize an already uploaded SourceForge release without uploading again
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      SOURCEFORGE_SSH_KEY:
        required: true
permissions:
  contents: write
concurrency:
  group: sourceforge-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCEFORGE_USERNAME: ${{ vars.SOURCEFORGE_USERNAME }}
      SOURCEFORGE_PROJECT: ${{ vars.SOURCEFORGE_PROJECT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download and verify published ISO
        if: inputs.finalize_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha)?$ ]]
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir parts \
            --pattern "azurefin-$RELEASE_TAG-aarch64.iso.part-*" \
            --pattern SHA256SUMS --pattern ISO-SHA256SUM \
            --pattern BUILD-INFO.txt --pattern iso-audit.log
          python3 surface/assemble_release_iso.py "$RELEASE_TAG" parts upload
      - name: Upload complete ISO with pinned SSH host key
        if: inputs.finalize_only != true
        env:
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCEFORGE_USERNAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$SOURCEFORGE_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          test -n "$SOURCEFORGE_SSH_KEY"
          umask 077
          key=$(mktemp "$RUNNER_TEMP/sourceforge-key.XXXXXX")
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$SOURCEFORGE_SSH_KEY" > "$key"
          unset SOURCEFORGE_SSH_KEY
          export RSYNC_RSH="ssh -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/surface/sourceforge_known_hosts -o ConnectTimeout=30"
          # mkdir intentionally fails if this release directory already exists:
          # no published release may be silently replaced, even on a rerun.
          sftp -b - -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/surface/sourceforge_known_hosts" \
            "$SOURCEFORGE_USERNAME@frs.sourceforge.net" <<EOF
          mkdir /home/frs/project/$SOURCEFORGE_PROJECT/$RELEASE_TAG
          EOF
          # Default rsync behavior renames each temporary file after transfer;
          # never expose a partially uploaded .iso using --inplace.
          rsync -rtv --chmod=F644,D755 --timeout=120 upload/ \
            "$SOURCEFORGE_USERNAME@frs.sourceforge.net:/home/frs/project/$SOURCEFORGE_PROJECT/$RELEASE_TAG/"
          printf 'Full ISO: https://sourceforge.net/projects/%s/files/%s/azurefin-%s-aarch64.iso/download\n' \
            "$SOURCEFORGE_PROJECT" "$RELEASE_TAG" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Link the ISO and retain only the release checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 surface/finalize_iso_release.py "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$SOURCEFORGE_PROJECT"
